# ============================================================================
# DORMANT release workflow — PyPI publishing is intentionally disabled.
#
# The active definition below is a manual no-op (`workflow_dispatch`) so the
# YAML file parses cleanly and never reports a failed run. The real publish
# pipeline lives commented out further down.
#
# When you are ready to publish to PyPI:
#   1. Configure a Trusted Publisher on https://pypi.org for this repo:
#        Owner: stimpert-labs
#        Repo:  atonix
#        Workflow filename: release.yml
#        Environment name:  pypi
#      Docs: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#   2. Create a GitHub Environment named `pypi` (optionally with reviewers).
#   3. Delete the no-op block below and uncomment the publish block beneath it.
#   4. Cut a release by running:
#        uv run bump-my-version bump <patch|minor|major>
#        git push --follow-tags
#      The workflow then triggers automatically on tag pushes matching `v*`.
#
# The real job uses OIDC (id-token: write) — no API tokens or secrets required.
# ============================================================================

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noop:
    name: Release pipeline (disabled)
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "PyPI publishing is intentionally disabled."
          echo "See the header comments in .github/workflows/release.yml"
          echo "for instructions on enabling the real publish pipeline."

