name: Tag release

# When a release PR (branch release/vX.Y.Z, opened by prepare-release.yml) is
# merged into main, tag the merge commit as vX.Y.Z. The tag is pushed with the
# GitHub App token so that it triggers release.yml and docs.yml; a tag pushed
# with GITHUB_TOKEN would not start other workflows.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: Tag merged release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify version matches branch
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          branch_version="${HEAD_REF#release/v}"
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$branch_version" != "$project_version" ]]; then
            echo "::error::Branch $HEAD_REF does not match pyproject.toml version $project_version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$project_version" > /dev/null; then
            echo "::error::Tag v$project_version already exists"
            exit 1
          fi
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Configure git as the App bot user
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag --annotate "v$VERSION" --message "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Delete release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        continue-on-error: true
        run: git push origin --delete "$HEAD_REF"
