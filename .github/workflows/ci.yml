name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --group dev --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --group dev --frozen
      - name: mypy
        # Non-blocking initially — the codebase has a pre-existing baseline of
        # ~15 mypy errors in atonix/base.py, models.py, and processdata.py.
        # Remove `continue-on-error` once that baseline is resolved.
        continue-on-error: true
        run: uv run mypy atonix

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: uv sync --group dev --frozen --python ${{ matrix.python-version }}
      - name: pytest
        run: |
          uv run --python ${{ matrix.python-version }} \
            pytest -m "not integration" \
              --cov=atonix --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --group dev --frozen
      - name: Build sdist + wheel
        run: uv build
      - name: Validate with twine
        run: uv run twine check dist/*
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dev dependencies
        run: uv sync --group dev --frozen
      - name: Export runtime requirements
        run: |
          uv export --no-emit-project --no-dev --no-hashes \
            --format requirements-txt > requirements-audit.txt
      - name: pip-audit
        # Non-blocking initially — remove `continue-on-error` once the
        # dependency baseline is confirmed clean and you want this to gate PRs.
        continue-on-error: true
        run: uv run pip-audit --strict -r requirements-audit.txt
